<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sfondo gradiente -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Libro e-reader stilizzato -->
  <g transform="translate(64, 64)">
    <!-- Corpo del reader -->
    <rect x="-32" y="-40" width="64" height="80" rx="4" fill="url(#bookGrad)" stroke="#ecf0f1" stroke-width="2"/>
    
    <!-- Schermo -->
    <rect x="-28" y="-36" width="56" height="60" rx="2" fill="#ecf0f1"/>
    
    <!-- Testo sullo schermo -->
    <line x1="-22" y1="-26" x2="22" y2="-26" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="-18" x2="22" y2="-18" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="-2" x2="16" y2="-2" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="-22" y1="8" x2="22" y2="8" stroke="#bdc3c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-22" y1="14" x2="22" y2="14" stroke="#bdc3c7" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Icona download integrata -->
    <g transform="translate(0, 30)">
      <circle cx="0" cy="0" r="8" fill="#27ae60" opacity="0.9"/>
      <path d="M -3,-2 L 0,2 L 3,-2 M 0,-4 L 0,2" stroke="#ecf0f1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Pulsante home -->
    <circle cx="0" cy="42" r="3" fill="#95a5a6"/>
  </g>
</svg>
